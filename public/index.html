<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>わんこ日和 | 犬たちとの暮らしの記録</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3f4e0;--sky:#d9ecf4;--grass:#c9e0ae;--veil:rgba(243,246,225,.42);--surface:rgba(255,255,250,.96);--text:#4a4034;--muted:#7d7766;--accent:#6f9a4e;--line:#d7dcbc;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1f2a22;--sky:#1b2a35;--grass:#26402b;--veil:rgba(16,28,18,.7);--surface:rgba(58,76,62,.94);--text:#e6eedb;--muted:#9fb099;--accent:#9fcb7e;--line:#3d5441}
}
:root[data-theme="dark"]{--bg:#1f2a22;--sky:#1b2a35;--grass:#26402b;--veil:rgba(16,28,18,.7);--surface:rgba(58,76,62,.94);--text:#e6eedb;--muted:#9fb099;--accent:#9fcb7e;--line:#3d5441}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;line-height:1.9;letter-spacing:.02em;background-image:radial-gradient(circle at 85% 8%,rgba(255,244,200,.6),transparent 30%),linear-gradient(var(--veil),var(--veil)),url(images/grass.jpg);background-size:auto,auto,320px auto;background-repeat:no-repeat,no-repeat,repeat;background-attachment:fixed,fixed,scroll}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header{padding:20px 0;border-bottom:1px solid var(--line)}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-weight:700;font-size:1.2rem;color:var(--text)}
nav{display:flex;gap:16px;font-size:.9rem}nav a{color:var(--text);font-weight:700}nav a:hover{text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--accent);text-decoration-thickness:2px}
.hero{text-align:center;padding:48px 0 32px}
.hero .emoji{font-size:3rem}
.hero h1{margin:8px 0;font-size:1.6rem;letter-spacing:.08em}
.hero p{color:var(--muted);margin:0}
h2{font-size:1.15rem;margin:40px 0 16px;text-align:center;letter-spacing:.15em;padding-bottom:6px;border-bottom:3px dotted var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:16px;box-shadow:0 4px 14px rgba(60,80,40,.15)}
.card .meta{font-size:.8rem;color:var(--muted)}
.card h3{margin:4px 0 8px;font-size:1.05rem}
.card p{margin:0;font-size:.95rem}
.tag{display:inline-block;font-size:.75rem;padding:1px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted);margin-right:6px}
.dogs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.dog{text-align:center;padding-bottom:28px}
.dog .face{font-size:2.4rem;background:var(--bg);border-radius:12px;padding:12px 0;margin-bottom:8px}
.dog b{display:block}
.dog span{font-size:.85rem;color:var(--muted)}
footer{margin-top:48px;padding:24px 0;border-top:1px solid var(--line);text-align:center;font-size:.8rem;color:var(--muted)}
.hero .hero-img{display:block;width:100%;max-width:560px;height:auto;margin:0 auto 20px;border-radius:22px;border:6px solid var(--surface);box-shadow:0 6px 20px rgba(60,80,40,.25)}
.dog .face-img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;margin-bottom:10px}
header,main,footer{position:relative;z-index:1}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
.reveal.show{opacity:1;transform:none}
.hero .hero-img{animation:pop .9s ease backwards;will-change:transform}
@keyframes pop{from{opacity:0;transform:scale(.9) rotate(-3deg)}to{opacity:1;transform:none}}
.paw{position:fixed;bottom:-40px;z-index:0;pointer-events:none;opacity:0;animation:drift linear forwards}
@keyframes drift{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.35}90%{opacity:.25}100%{transform:translateY(-110vh) rotate(40deg);opacity:0}}
.burst{position:fixed;z-index:5;pointer-events:none;animation:burst .8s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(40deg);opacity:0}}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;width:0;background:var(--accent);z-index:20}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}.hero .hero-img,.dog.wiggle{animation:none}}
[hidden]{display:none!important}
.card h3 a{color:inherit}
.more{display:inline-block;margin-top:8px;font-size:.85rem;font-weight:700}
.card.linked{cursor:pointer;transition:box-shadow .3s}
.card.linked:hover{box-shadow:0 8px 22px rgba(60,80,40,.28)}
.post-title{font-size:1.4rem;margin:6px 0 16px;line-height:1.5}
.post-body p{margin:0 0 1.1em}
.back{display:inline-block;margin:24px 0 12px;font-weight:700}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:20px;font-size:.9rem}
header{background:var(--surface);backdrop-filter:blur(6px)}
footer{background:var(--surface);border-radius:18px 18px 0 0}
.hero h1,.hero p,h2{text-shadow:0 0 6px var(--bg),0 0 12px var(--bg),0 0 18px var(--bg)}
.dog .face-img{position:relative;transition:transform .35s ease,box-shadow .35s ease}
@media (hover:hover){.dog .face-img:hover{transform:scale(1.18);z-index:3;box-shadow:0 10px 26px rgba(40,60,30,.4)}}
@media (prefers-reduced-motion:reduce){.dog .face-img{transition:none}}
.post-body h2.sub{text-align:left;font-size:1.05rem;letter-spacing:.05em;margin:30px 0 10px;padding-bottom:4px;border-bottom:2px dotted var(--accent);text-shadow:none}
.post-img{display:block;width:100%;max-width:260px;aspect-ratio:1;object-fit:cover;border-radius:14px;margin:8px auto 14px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="#top">🐾 Daily Life with My Dog</a>
    <nav><a href="#posts">記事</a><a href="#dogs">うちの子</a><a href="#about">このブログについて</a></nav>
  </div>
</header>

<main class="wrap" id="top">
  <section class="hero">
    <img class="hero-img" src="images/hero.jpg" alt="芝生の上を元気に走ってくる2匹の犬">
    <h1>犬たちとの、ふつうで特別な毎日</h1>
    <p>散歩、お昼寝。あの日の陽だまりを思い出すように、<br>うちの子たちとの暮らしを綴ります。</p>
  </section>

  <h2 id="posts">最新の記事</h2>
  <div id="post-list"></div>

  <h2 id="dogs">うちの子たち</h2>
  <div class="dogs">
    <div class="card dog"><img class="face-img" src="images/koo.jpg" alt="クーの写真"><b>クー</b><span>マルキー</span></div>
    <div class="card dog"><img class="face-img" src="images/peko.jpg" alt="ペコの写真"><b>ペコ</b><span>シーズー</span></div>
    <div class="card dog"><img class="face-img" src="images/haru.jpg" alt="ハルの写真"><b>ハル</b><span>シーズー</span></div>
  </div>

  <h2 id="about">このブログについて</h2>
  <div class="card">
    <p>犬たちとの暮らしで見つけた小さな発見や楽しい出来事を、日記のように残していくブログです。同じように犬と暮らす方の、ちょっとしたヒントになればうれしいです。</p>
  </div>
</main>

<footer>〜 Daily Life with My Dog 〜<br>© 2026</footer>
<script>
(function(){
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var bar=document.createElement('div');bar.id='bar';document.body.appendChild(bar);

  // スクロールで要素がふわっと現れる
  var targets=document.querySelectorAll('.hero h1,.hero p,h2,.card:not(.dog)');
  targets.forEach(function(el,i){el.classList.add('reveal');});
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('show');io.unobserve(e.target);}});
    },{threshold:0.15});
    targets.forEach(function(el){io.observe(el);});
  }else{targets.forEach(function(el){el.classList.add('show');});}

  // スクロール進捗バー＋トップ画像のゆるいパララックス
  var hero=document.querySelector('.hero-img'),ticking=false;
  function onScroll(){
    var h=document.documentElement.scrollHeight-window.innerHeight;
    bar.style.width=(h>0?window.scrollY/h*100:0)+'%';
    if(hero&&!reduce){hero.style.transform='translateY('+Math.min(window.scrollY*0.12,60)+'px)';}
    ticking=false;
  }
  window.addEventListener('scroll',function(){if(!ticking){ticking=true;requestAnimationFrame(onScroll);}},{passive:true});

  // 背景をふわふわ舞う肉球
  function spawnPaw(){
    var p=document.createElement('span');p.className='paw';p.textContent='\uD83D\uDC3E';
    p.style.left=Math.random()*95+'vw';p.style.fontSize=(16+Math.random()*20)+'px';
    p.style.animationDuration=(9+Math.random()*7)+'s';
    p.addEventListener('animationend',function(){p.remove();});
    document.body.appendChild(p);
  }
  if(!reduce){spawnPaw();setInterval(function(){if(!document.hidden)spawnPaw();},1400);}

  // タップ位置から肉球がぽんっと飛び出す
  function burst(x,y,n){
    if(reduce)return;
    for(var i=0;i<n;i++){
      var b=document.createElement('span');b.className='burst';b.textContent='\uD83D\uDC3E';
      var a=Math.random()*Math.PI*2,d=40+Math.random()*60;
      b.style.left=x+'px';b.style.top=y+'px';
      b.style.setProperty('--dx',Math.cos(a)*d+'px');b.style.setProperty('--dy',Math.sin(a)*d+'px');
      b.addEventListener('animationend',function(){this.remove();});
      document.body.appendChild(b);
    }
  }
  if(hero){hero.addEventListener('click',function(e){burst(e.clientX,e.clientY,7);});}

})();
</script>
<script>
(function(){
  var home=document.querySelector('main'),homeTitle=document.title;
  var view=document.createElement('main');view.className='wrap';view.id='article-view';view.hidden=true;
  home.parentNode.insertBefore(view,home.nextSibling);
  var list=document.getElementById('post-list'),posts=[],cache={};

  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
  function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
  function show(d){return d.replace(/-/g,'.');}

  // 記事ファイルの書き方：「## 見出し」「[img:画像のパス]」、空行で段落を区切る
  function parse(text){
    return text.replace(/\r/g,'').split(/\n{2,}/).map(function(b){
      b=b.trim();if(!b)return '';
      if(b.indexOf('## ')===0)return '<h2 class="sub">'+esc(b.slice(3))+'</h2>';
      var m=b.match(/^\[img:(.+)\]$/);
      if(m)return '<img class="post-img" src="'+esc(m[1])+'" alt="">';
      return '<p>'+esc(b).replace(/\n/g,'<br>')+'</p>';
    }).join('');
  }

  function renderList(){
    list.innerHTML='';
    posts.forEach(function(p){
      var c=document.createElement('article');c.className='card linked';
      c.innerHTML='<div class="meta">'+show(p.date)+' <span class="tag">'+esc(p.tag)+'</span></div>'+
        '<h3><a href="#'+esc(p.id)+'">'+esc(p.title)+'</a></h3><p>'+esc(p.summary)+'</p>'+
        '<a class="more" href="#'+esc(p.id)+'">続きを読む →</a>';
      c.addEventListener('click',function(e){if(!e.target.closest('a'))location.hash=p.id;});
      list.appendChild(c);
    });
    if(!posts.length)list.innerHTML='<div class="card"><p>記事は準備中です。</p></div>';
  }

  function showPost(i){
    var p=posts[i],older=posts[i+1],newer=posts[i-1];
    function draw(html){
      view.innerHTML='<a class="back" href="#posts">← 記事一覧へ戻る</a>'+
        '<article class="card"><div class="meta">'+show(p.date)+' <span class="tag">'+esc(p.tag)+'</span></div>'+
        '<h1 class="post-title">'+esc(p.title)+'</h1><div class="post-body">'+html+'</div></article>'+
        '<div class="pn"><span>'+(older?'<a href="#'+esc(older.id)+'">← '+esc(older.title)+'</a>':'')+'</span>'+
        '<span>'+(newer?'<a href="#'+esc(newer.id)+'">'+esc(newer.title)+' →</a>':'')+'</span></div>';
    }
    document.title=p.title+' | わんこ日和';
    home.hidden=true;view.hidden=false;window.scrollTo(0,0);
    if(cache[p.id]!==undefined){draw(cache[p.id]);return;}
    view.innerHTML='<p>読み込み中…</p>';
    fetch('posts/'+p.file).then(function(r){if(!r.ok)throw 0;return r.text();}).then(function(t){
      cache[p.id]=parse(t);if(location.hash.slice(1)===p.id)draw(cache[p.id]);
    }).catch(function(){view.innerHTML='<a class="back" href="#posts">← 記事一覧へ戻る</a><p>記事を読み込めませんでした。</p>';});
  }

  function route(){
    var id=location.hash.slice(1),i=-1;
    posts.forEach(function(p,k){if(p.id===id)i=k;});
    if(i>=0){showPost(i);return;}
    var was=!view.hidden;view.hidden=true;home.hidden=false;document.title=homeTitle;
    var t=id&&document.getElementById(id);
    if(t){setTimeout(function(){t.scrollIntoView();},0);}else if(was){window.scrollTo(0,0);}
  }
  window.addEventListener('hashchange',route);

  // 予約投稿：日付が今日より先の記事は、その日が来るまで表示しない
  fetch('posts/posts.json').then(function(r){return r.json();}).then(function(a){
    posts=a.filter(function(p){return p.date<=today();}).sort(function(x,y){return x.date<y.date?1:-1;});
    renderList();route();
  }).catch(function(){list.innerHTML='<div class="card"><p>記事を読み込めませんでした。</p></div>';});
})();
</script>
</body>
</html>
